[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "1.0.0"
description = "SPECTRA - Evidence-Grounded Multimodal Enterprise Investigation Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SPECTRA" }]

dependencies = [
  # --- API / core ---
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.0",
  "httpx>=0.26",
  "PyYAML>=6.0",
  "structlog>=24.1",
  "psutil>=5.9",
  "orjson>=3.9",
  # --- relational ---
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.19",
  "greenlet>=3.0",
  # --- retrieval / matching ---
  "numpy>=1.24,<2",
  "rapidfuzz>=3.6",
  "sqlparse>=0.4.4",
  # --- document extraction ---
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "filetype>=1.2",
  # --- media ---
  "Pillow>=10.2",
]

[project.optional-dependencies]
# Heavy ML stack - installed by `make install-ml`
ml = [
  "torch>=2.2",
  "sentence-transformers>=2.6",
  "faster-whisper>=1.0",
  "opencv-python-headless>=4.9,<5",
  "scenedetect>=0.6.4",
  # Pip-installable PP-OCR via ONNX Runtime - needs no system packages, which is
  # why it is the default OCR engine rather than PaddleOCR or Tesseract.
  "rapidocr-onnxruntime>=1.3",
  "nvidia-ml-py>=12.535",
  # CTranslate2 (faster-whisper) dlopens cuDNN/cuBLAS itself and aborts the
  # process if they are absent, so they are explicit dependencies of the GPU
  # path rather than something inherited from torch by accident.
  "nvidia-cudnn-cu12>=9.1; platform_system == 'Linux'",
  "nvidia-cublas-cu12>=12.1; platform_system == 'Linux'",
]
# Distributed backends - installed by `make install-backends`
backends = [
  "qdrant-client>=1.8",
  "opensearch-py>=2.4",
  "neo4j>=5.17",
  "redis>=5.0",
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "PyMySQL>=1.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "black>=24.2",
]

[project.scripts]
spectra = "spectra_api.cli:main"

[tool.setuptools.packages.find]
# Grouped by which pipeline each package belongs to.  The directory tree is the
# documentation: `ingest/` only ever writes indexes, `query/` only ever reads
# them, `shared/` is used by both, and nothing in `query/` may perform the
# expensive media processing that belongs in `ingest/`.
where = [
  "packages/config",
  "packages/schemas",
  "packages/tool_contracts",
  # --- Pipeline A: ingestion / indexing (write path) ---
  "services/ingest/ingestion",
  # --- Pipeline B: search / investigation (read path) ---
  "services/query/search",
  "services/query/evidence",
  "services/query/agent",
  # --- shared by both pipelines ---
  "services/shared/ai_core",
  "services/shared/storage",
  "services/shared/entity_resolution",
  "services/shared/connectors",
  # --- process entry points ---
  "services/api",
  "services/worker",
  "evaluation",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "integration: requires external infrastructure",
  "e2e: end-to-end acceptance scenario",
  "slow: long running",
]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "node_modules", "data", "models", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "B904"]

[tool.black]
line-length = 110

# ---------------------------------------------------------------------------
# SPECTRA - optional NVIDIA GPU overlay (DEVELOPER stack).
#
#   make up GPU=1
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up -d
#
# Why an overlay instead of `COMPOSE_PROFILES=gpu`:
#   Compose profiles add or remove whole services; they cannot add a
#   `deploy.resources` block to an existing one.  Expressing GPU access with a
#   profile therefore requires a second, profile-gated copy of `api` - which
#   collides with the first on container_name and drifts on every edit.
#   An overlay file changes exactly the four lines that differ, and a host
#   without an NVIDIA runtime simply never passes the extra -f flag.
#
# Requires the NVIDIA Container Toolkit on the host:
#   docker info | grep -i runtimes      # must list "nvidia"
#   ./scripts/gpu-check.sh              # reports driver/library mismatches
#
# Only api and worker request GPUs.  Datastores never do.
# ---------------------------------------------------------------------------

services:

  api:
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  worker:
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
